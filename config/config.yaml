# Data paths
paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  output_dir: "reports"
  charts_dir: "reports/figures"

# Preprocessing & cleaning configuration
cleaning:
  start_date: "2017-01-01"
  end_date: "2018-08-20" # Removed database cutoff anomaly in late August 2018

# Time series forecasting parameters
forecasting:
  test_days: 30
  target_col: "order_count"
  date_col: "date"
  cv_splits: 5 # Number of splits for Time Series Cross-Validation

# Model hyperparameter configuration
models:
  sarimax:
    order: [1, 1, 1]
    seasonal_order: [1, 1, 1, 7]
  prophet:
    growth: "linear"
    yearly_seasonality: true
    weekly_seasonality: true
    daily_seasonality: false
  xgboost:
    n_estimators: 100
    learning_rate: 0.05
    max_depth: 5
    random_state: 42
  lightgbm:
    n_estimators: 100
    learning_rate: 0.05
    max_depth: 5
    random_state: 42
